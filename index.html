<style>:root{--navy:#1c2a44;--slate:#4a5a70;--mist:#e8ebef;--bg:#f3f5f8;--card:#fff;--ink:#0d1420;--muted:#4a5568;--line:#cfd6df;
--ok:#0a7d32;--okbg:#e3f5e8;--bad:#c4161c;--badbg:#fde8e8;--warn:#9a5b00;--warnbg:#fff3d6;--blue:#0055cc;--pink:#d6187a;--rail:#e08a00;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html.dark{--bg:#0b1220;--card:#162033;--ink:#f4f6fa;--muted:#b9c3d1;--line:#2c3a52;--okbg:#0f3320;--badbg:#3d1013;--warnbg:#3a2a07;--ok:#5fd68a;--bad:#ff6b6b;--warn:#ffc04d;--blue:#7fb2ff;--mist:#22304a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-left:var(--sal);padding-right:var(--sar);padding-bottom:calc(92px + var(--sab))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(8px + var(--sat)) 12px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header.top img{width:54px;height:49px;flex:none}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:19px;letter-spacing:.3px}.brand small{display:block;font-size:13px;color:#c9d2de;letter-spacing:1.5px;text-transform:uppercase}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;min-width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.jobbar{background:var(--slate);padding:10px 12px;position:sticky;top:calc(65px + var(--sat));z-index:19}
.jobbar select{width:100%;font-size:18px;font-weight:700;padding:12px;border-radius:12px;border:0;background:#fff;color:#0d1420;-webkit-appearance:none;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,#1c2a44 50%),linear-gradient(135deg,#1c2a44 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 15px) 52%;background-size:7px 7px;background-repeat:no-repeat}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.card h2{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card h2 svg{flex:none}
.card h3{margin:14px 0 6px;font-size:17px}
label.f{display:block;font-weight:700;margin:10px 0 4px;font-size:16px}
label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font-size:18px;font-family:inherit}
input[type=number],input[type=text],input[type=time],input[type=date],textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:52px}
input:focus,textarea:focus,select:focus{outline:3px solid #f2a900;outline-offset:1px;border-color:var(--navy)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;border:2px solid var(--navy);border-radius:12px;overflow:hidden;margin-top:4px}
html.dark .seg{border-color:var(--blue)}
.seg button{flex:1;min-height:52px;font-size:17px;font-weight:700;border:0;background:var(--card);color:var(--ink)}
.seg button.on{background:var(--navy);color:#fff}
html.dark .seg button.on{background:var(--blue);color:#0b1220}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:14px;border:0;font-size:19px;font-weight:800;margin:8px 0;text-decoration:none;color:#fff;background:var(--navy)}
html.dark .btn{background:#2d4470}
.btn.green{background:#0a7d32}.btn.wa{background:#128c4a}.btn.red{background:#c4161c}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:76px;font-size:22px}
.banner{border-radius:14px;padding:14px;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.banner.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}.banner.bad{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.banner.warn{background:var(--warnbg);color:var(--warn);border:2px solid var(--warn)}
.banner small{display:block;font-weight:600;font-size:16px;color:var(--ink);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--mist);border-radius:12px;padding:10px}
html:not(.dark) .stat{background:#eef1f5}
.stat span{display:block;font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat.wide{grid-column:1/-1}
.datum{border:3px solid var(--pink);border-radius:14px;padding:12px;background:rgba(214,24,122,.07)}
.datum b.t{color:var(--pink);font-size:20px;display:flex;gap:8px;align-items:center}
.rail{border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.rtag{display:inline-block;background:#000;color:#fff;font-weight:900;border-radius:8px;padding:4px 10px;font-size:18px;letter-spacing:.5px}
html.dark .rtag{background:#fff;color:#000}
.rlen{display:inline-block;background:#fff3b0;color:#000;border:2px solid #000;border-radius:8px;padding:2px 10px;font-weight:900;font-size:22px;margin-left:8px}
.cut{font-size:20px;font-weight:800;margin:6px 0}
.hooks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hk{border:2px solid #008a2e;border-radius:10px;padding:4px 8px;font-weight:800;font-size:17px;background:var(--card)}
.hk i{font-style:normal;color:#008a2e;margin-right:4px}
html.dark .hk i{color:#5fd68a}
.blue{color:var(--blue);font-weight:800}
.flag{padding:10px 12px;border-radius:10px;margin:6px 0;font-weight:700;font-size:17px}
.flag.red{background:var(--badbg);color:var(--bad);border-left:6px solid var(--bad)}
.flag.amber{background:var(--warnbg);color:var(--warn);border-left:6px solid var(--warn)}
.flag.info{background:var(--mist);color:var(--ink);border-left:6px solid var(--slate)}
.tick{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);font-size:18px}
.tick:last-child{border-bottom:0}
.tick input[type=checkbox]{width:32px;height:32px;flex:none;margin:0;accent-color:#0a7d32}
.tick.done span{color:var(--muted);text-decoration:line-through}
.tick .cnt{width:96px;flex:none;min-height:46px;padding:8px;text-align:center}
.tick .need{font-weight:900}
.short{color:var(--bad);font-weight:800}
.prog{height:12px;background:var(--mist);border-radius:8px;overflow:hidden;margin:4px 0 10px}.prog i{display:block;height:100%;background:#0a7d32}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);display:flex;padding:6px calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal));gap:6px;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
nav.tabs button{flex:1;min-height:66px;border:0;border-radius:12px;background:transparent;color:#c9d2de;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button.on{background:#fff;color:var(--navy)}
.tab{display:none}.tab.on{display:block}
pre.report{white-space:pre-wrap;background:var(--mist);border-radius:12px;padding:12px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}table.past{width:100%;border-collapse:collapse;font-size:15px}
table.past th,table.past td{text-align:left;padding:8px 4px;vertical-align:top;border-bottom:1px solid var(--line)}
table.past th{font-size:12px;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.timebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{display:flex;gap:8px;align-items:center;margin:8px 0}
.stage b{flex:1.2;font-size:17px}.stage input{flex:1}.stage button{flex:none;min-height:52px;padding:0 14px;border-radius:12px;border:2px solid var(--navy);background:var(--card);color:var(--ink);font-weight:800;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-width:64px;min-height:52px;border-radius:12px;border:2px solid var(--navy);background:var(--card);color:var(--ink);font-weight:800;font-size:18px}
.chips button.on{background:var(--navy);color:#fff}
.muted{color:var(--muted)}.small{font-size:15px}
.svgwrap{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 6px}
.hidden{display:none!important}
.warnstore{background:#c4161c;color:#fff;padding:10px 12px;font-weight:700;font-size:16px}
details summary{font-weight:800;min-height:44px;display:flex;align-items:center;cursor:pointer}
html.dark .chips button{border-color:#5a6b85}
html.dark .chips button.on{background:var(--blue);border-color:var(--blue);color:#0b1220}

.mcut{font-size:21px;color:var(--ink)}
.meshbox{background:#fff;color:#1c2a44;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 12px}
html.dark .meshbox{background:#0f1828;color:#f4f6fa}

/* v1.3 multi-roof report */
.roof{border-left:6px solid var(--navy)}html.dark .roof{border-left-color:var(--blue)}
.roofhd{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.roofno{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
html.dark .roofno{background:var(--blue);color:#0b1220}
.roofname{flex:1;min-width:0;font-size:19px !important;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>div{min-width:0}
.tnow{display:flex;gap:6px}.tnow input{flex:1;min-width:0}
.tnow button{flex:none;min-height:52px;padding:0 10px;border-radius:12px;border:2px solid var(--navy);background:var(--card);color:var(--ink);font-weight:800;font-size:15px}
html.dark .tnow button,html.dark .stage button{border-color:#5a6b85}
input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;display:block}
html.dark .roof .btn.ghost{background:transparent;color:#ffb3b3;border-color:#7a3a3a}.roof .btn.ghost{color:#c4161c;border-color:#e8b4b6}
</style>

/* ===== EJD SOLAR ENGINE – same rules as the Python sheet scripts (make_diagrams / mck_base / hooks_g / hooks_fixed) ===== */
var K = {PL:1762, PW:1134, GAP:8, OH:50, ENDC:30, STOCK:3650, KERF:5, MINCUT:700, P_IN:440, L_IN:284,
         EDGE:300, MAXSP:1200, TGT:300, JC:150, FRAME:50, END_LO:250, END_HI:350};
function mod(a, n){ return ((a % n) + n) % n; }
function dims(o){ return o === 'L' ? {w:K.PL, h:K.PW, ins:[K.L_IN, K.PW-K.L_IN]} : {w:K.PW, h:K.PL, ins:[K.P_IN, K.PL-K.P_IN]}; }
function runWidth(n, o){ var d = dims(o); return n > 0 ? n*d.w + (n-1)*K.GAP : 0; }
/* max panels in a run of usable width */
function maxAcross(usable, o){ var d = dims(o); return Math.max(0, Math.floor((usable + K.GAP)/(d.w + K.GAP))); }
/* bars: full 3650 from the LEFT end, only the end piece cut. Never leave an end piece under 700. */
function barPieces(L){
  var p = [], rest = L;
  while (rest > K.STOCK){ p.push(K.STOCK); rest -= K.STOCK; }
  p.push(rest);
  var twoCut = false;
  if (p.length > 1 && rest < K.MINCUT){ p[p.length-2] = K.STOCK - (K.MINCUT - rest); p[p.length-1] = K.MINCUT; twoCut = true; }
  return {pieces:p, twoCut:twoCut};
}
function ffd(pieces){
  var bars = [];
  pieces.slice().sort(function(a,b){return b-a;}).forEach(function(p){
    for (var i=0;i<bars.length;i++){ var b = bars[i], s = 0; b.forEach(function(x){s+=x;});
      if (s + K.KERF*b.length + p <= K.STOCK){ b.push(p); return; } }
    bars.push([p]);
  });
  return bars;

function meshTot(ms){ var s = 0; ms.forEach(function(x){ s += x.side; }); return {side: s, cut: s + 300*ms.length}; }

          {k:'hooks', n:k.hooks, t:'Roof hooks'}, {k:'tbolts', n:k.hooks, t:'T-bolts + nuts'}, {k:'endC', n:k.endC, t:'End clamps (30 mm)'}, {k:'midC', n:k.midC, t:'Mid clamps'},

/* ---------- render: REPORT ---------- */
var STAGES = [['hooks','Hooks done'],['rails','Rails done'],['panels','Panels done'],['mesh','Mesh done']];
function newRoof(name, exp){ return {name: name || '', exp: exp == null ? '' : String(exp), fitted: '', start: '', finish: '', st: {}, issues: '', notes: ''}; }
/* make sure D.r.roofs exists; old single-roof reports move into Roof 1 */
function roofs(){
  var r = D.r, jb = job(), k = kit(calc());
  if (!r.roofs || !r.roofs.length){
    if (jb && jb.roofs && jb.roofs.length) r.roofs = jb.roofs.map(function(x){ return newRoof(x.name, x.panels); });
    else r.roofs = [newRoof(jb && jb.orient ? 'Roof 1' : 'Roof 1', k ? k.panels : (jb && jb.design ? jb.design.panels : ''))];
    var r1 = r.roofs[0];
    if (r.fitted) r1.fitted = r.fitted;
    if (r.st){ for (var s in r.st) if (r.st[s]) r1.st[s] = r.st[s]; }
    if (r.roofs.length === 1){ r1.start = r1.start || r.start || ''; r1.finish = r1.finish || r.finish || ''; }
    delete r.fitted; r.st = {}; setJ(D);
  }
  return r.roofs;
}
function roofCalc(x){ var t = mins(x.start, x.finish), f = num(x.fitted), e = num(x.exp); return {t: t, f: f, e: e, mpp: t != null && f ? t / f : null}; }
function reportText(){
  var jb = job(), r = D.r, c = calc(), m = D.m, R = roofs();
  var total = mins(r.start, r.finish), team = num(r.team), fitted = 0, exp = 0, anyF = false, anyE = false;
  R.forEach(function(x){ var q = roofCalc(x); if (q.f != null){ fitted += q.f; anyF = true; } if (q.e != null){ exp += q.e; anyE = true; } });
  if (!anyF) fitted = null; if (!anyE) exp = null;
  var L = [];
  L.push('SOLAR REPORT ' + (jb ? jb.sc : 'NEW JOB'));
  L.push('Job: ' + (jb ? jb.name : (r.name || '–')));
  L.push('Address: ' + (jb ? jb.address : (r.addr || '–')));
  L.push('Date: ' + ukDate(r.date));
  L.push('Team: ' + (team || '–') + ' men');
  L.push('Roofs: ' + R.length);
  R.forEach(function(x, i){ var q = roofCalc(x);
    L.push('');
    L.push('=== ROOF ' + (i + 1) + ': ' + (x.name || 'Roof ' + (i + 1)) + ' ===');
    L.push('Panels: ' + (q.f != null ? q.f : '–') + ' fitted of ' + (q.e != null ? q.e : '–') + ' designed' + (q.f != null && q.e != null && q.f < q.e ? ' – ' + (q.e - q.f) + ' NOT FITTED' : ''));
    L.push('Start: ' + (x.start || '–') + ' | Finish: ' + (x.finish || '–') + ' | Time: ' + (q.t != null ? hm(q.t) : '–') + (q.mpp ? ' | ' + q.mpp.toFixed(1) + ' min/panel' : ''));
    var prev = x.start;
    STAGES.forEach(function(s){ var t = x.st[s[0]]; L.push('- ' + s[1] + ': ' + (t ? t + (prev ? ' (' + hm(mins(prev, t)) + ' for this stage)' : '') : '–')); if (t) prev = t; });
    L.push('Short / issues: ' + (x.issues || 'none'));
    if (x.notes) L.push('Notes: ' + x.notes);
  });
  L.push('');
  L.push('=== TOTALS ===');
  L.push('Job start: ' + (r.start || '–') + ' | Job finish: ' + (r.finish || '–'));
  L.push('Overall time on site: ' + (total != null ? hm(total) + ' (' + total + ' min)' : '–'));
  L.push('Panels fitted (all roofs): ' + (fitted != null ? fitted : '–') + ' of ' + (exp != null ? exp : '–') + ' designed' + (fitted != null && exp != null && fitted < exp ? ' – ' + (exp - fitted) + ' NOT FITTED' : ''));
  var mpp = total != null && fitted ? total / fitted : null;
  L.push('Minutes per panel: ' + (mpp ? mpp.toFixed(1) + (team ? ' (' + (mpp * team).toFixed(0) + ' man-minutes per panel)' : '') : '–'));
  if (!c.minimal){ var sl = c.slopeUsed;
    L.push('Roof measured (Measure tab): width ' + (num(m.roofW) ? fmt(num(m.roofW)) + ' mm' : '–') + ' | ridge to eaves ' + (sl ? fmt(sl) + ' mm on slope' + (m.slopeMode === 'plan' ? ' (plan ' + m.planD + ' @ ' + m.pitch + ' deg)' : '') : '–') +
         ' | rafters ' + (m.raf || '–') + ' c/c' + (num(m.firstRaf) != null ? ' | first rafter ' + m.firstRaf + ' from left verge' : ''));
    if (c.p){ var bad = c.p.flags.filter(function(f){ return /WON'T FIT/.test(f.t); });
      L.push('Design check: ' + (num(m.roofW) ? (bad.length ? 'WON\'T FIT – ' + bad.map(function(f){ return f.t; }).join(' ') : 'fits (spare ' + fmt(c.p.spareW / 2) + ' each side)') : 'roof not measured')); } }
  var sh = shortages(); if (r.extraShort) sh.push(r.extraShort);
  L.push('Delivery: ' + (sh.length ? 'SHORTAGES – ' + sh.join('; ') : 'all correct'));
  L.push('Job notes: ' + (r.notes || 'none'));
  L.push('Photos: sent separately in WhatsApp');
  L.push('END OF REPORT (EJD Solar Site app ' + APP_VER + ')');
  return {text: L.join('\n'), total: total, fitted: fitted, exp: exp, mpp: mpp, team: team};
}

    if (R.length > 1) h += '<button type="button" class="btn ghost" data-rdel="'+i+'">Remove this roof</button>';

    else this.href = 'mailto:' + JOHN_EMAIL + '?subject=' + encodeURIComponent(t.split('\n')[0] + ' – ' + (jb ? jb.name : (D.r.name || ''))) + '&body=' + encodeURIComponent(t);
    savePast(); }); });
  if ($('shareBtn')) $('shareBtn').addEventListener('click', function(){ savePast(); navigator.share({title: 'Solar report', text: reportText().text}).catch(function(){}); });
  $('copyBtn').addEventListener('click', function(){ var t = reportText().text;
    function done(){ $('copyBtn').textContent = 'Copied ✓'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); }); else { fallbackCopy(t); done(); } });
  $('savePast').addEventListener('click', function(){ savePast(); renderReport(); });
  if ($('clearPast')) $('clearPast').addEventListener('click', function(){ if (confirm('Clear the past jobs list on this phone?')){ save('ejd_past', []); renderReport(); } });
}
function fallbackCopy(t){ var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} document.body.removeChild(ta); }

/* ---------- shell ---------- */
function render(){ D = J();
  ['measure','sheet','report'].forEach(function(t){ $('t_'+t).className = 'tab' + (S.tab === t ? ' on' : ''); $('nb_'+t).className = S.tab === t ? 'on' : ''; });
  if (S.tab === 'measure') renderMeasure(); else if (S.tab === 'sheet') renderSheet(); else renderReport(); }
function init(){
  var sel = $('jobSel');
  sel.innerHTML = JOBS.map(function(j){ return '<option value="'+j.id+'">'+esc(j.name)+' · '+esc(j.sc)+' · '+dayName(j.date)+'</option>'; }).join('') + '<option value="manual">Other job – calculator</option>';
  if (S.jobId !== 'manual' && !job()) S.jobId = JOBS.length ? JOBS[0].id : 'manual';
  sel.value = S.jobId;
  sel.addEventListener('change', function(){ S.jobId = sel.value; save('ejd_job', S.jobId); window.scrollTo(0, 0); render(); });
  ['measure','sheet','report'].forEach(function(t){ $('nb_'+t).addEventListener('click', function(){ S.tab = t; save('ejd_tab', t); window.scrollTo(0, 0); render(); }); });
  var dark = load('ejd_dark', false); document.documentElement.className = dark ? 'dark' : '';
  function themeIcon(){ $('themeBtn').innerHTML = document.documentElement.className === 'dark' ? ICON.sun : ICON.moon; }
  themeIcon();
  $('themeBtn').addEventListener('click', function(){ var d = document.documentElement.className !== 'dark'; document.documentElement.className = d ? 'dark' : ''; save('ejd_dark', d); themeIcon(); });
  $('nb_measure').innerHTML = ICON.ruler + 'Measure'; $('nb_sheet').innerHTML = ICON.list + 'Job sheet'; $('nb_report').innerHTML = ICON.send + 'Report';
  if (!CAN_SAVE) $('storeWarn').className = 'warnstore';
  $('ver').textContent = APP_VER;
  render();
}
document.addEventListener('DOMContentLoaded', init);

try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){}
